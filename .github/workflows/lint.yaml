name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v1

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_test.txt mypy
      - run: mypy custom_components/choreflow

  card:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify third-party notices
        run: |
          grep -Fq "Copyright (c) 2017 Google LLC" dist/choreflow-card.js
          grep -Fq "Copyright (c) 2019 Custom cards for Home Assistant" dist/choreflow-card.js
          test -f ../THIRD_PARTY_NOTICES.md
      - name: Verify bundled card matches source
        run: |
          cp dist/choreflow-card.js ../custom_components/choreflow/www/choreflow-card.js
          git diff --exit-code -- ../custom_components/choreflow/www/choreflow-card.js \
            || (echo "::error::www/choreflow-card.js is stale — rebuild in card/ (npm run build) and copy dist/choreflow-card.js to custom_components/choreflow/www/" && exit 1)

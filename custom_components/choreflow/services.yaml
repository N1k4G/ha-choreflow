create_task:
  name: Create task
  description: Create a one-off ChoreFlow task.
  fields:
    title:
      name: Title
      description: Short task title.
      required: true
      selector:
        text:
    description:
      name: Description
      selector:
        text:
    room:
      name: Room
      selector:
        text:
    category:
      name: Category
      selector:
        text:
    importance:
      name: Importance
      selector:
        select:
          options: [high, normal, low]
    estimated_duration_minutes:
      name: Estimated duration
      description: Estimated task duration in minutes.
      selector:
        number:
          min: 1
          max: 1440
          mode: box
    due_date:
      name: Due date
      selector:
        date:
    visibility_mode:
      name: Visibility mode
      selector:
        select:
          options: [all_enabled_persons, selected_persons]
    visibility_persons:
      name: Visible to persons
      selector:
        entity:
          domain: person
          multiple: true
    assignment_mode:
      name: Assignment mode
      selector:
        select:
          options: [random, assigned]
    assignment_person:
      name: Assigned person
      selector:
        entity:
          domain: person

update_task:
  name: Update task
  description: Update fields of an existing ChoreFlow task.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    title:
      name: Title
      selector:
        text:
    description:
      name: Description
      selector:
        text:
    room:
      name: Room
      selector:
        text:
    category:
      name: Category
      selector:
        text:
    importance:
      name: Importance
      selector:
        select:
          options: [high, normal, low]
    estimated_duration_minutes:
      name: Estimated duration
      description: Estimated task duration in minutes.
      selector:
        number:
          min: 1
          max: 1440
          mode: box
    due_date:
      name: Due date
      selector:
        date:
    visibility_mode:
      name: Visibility mode
      selector:
        select:
          options: [all_enabled_persons, selected_persons]
    visibility_persons:
      name: Visible to persons
      selector:
        entity:
          domain: person
          multiple: true
    assignment_mode:
      name: Assignment mode
      selector:
        select:
          options: [random, assigned]
    assignment_person:
      name: Assigned person
      selector:
        entity:
          domain: person

delete_task:
  name: Delete task
  description: Delete a ChoreFlow task.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:

complete_task:
  name: Complete task
  description: Mark a task as completed and push the next one.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    person_entity:
      name: Person
      required: true
      selector:
        entity:
          domain: person
    source:
      name: Completion source
      description: Where the completion came from (push, dashboard, todo).
      selector:
        text:

snooze_task:
  name: Snooze task
  description: Postpone a task's reminder without changing its due date.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    person_entity:
      name: Person
      required: true
      selector:
        entity:
          domain: person

start_daily_flow:
  name: Start daily flow
  description: Start the daily push chain for one or all persons.
  fields:
    person_entity:
      name: Person
      description: Optional; omit to start for all enabled persons.
      selector:
        entity:
          domain: person

send_next_task:
  name: Send next task
  description: Advance the push chain for a person (send the next task).
  fields:
    person_entity:
      name: Person
      required: true
      selector:
        entity:
          domain: person

sync_todo:
  name: Sync to-do
  description: Run a manual to-do synchronisation (import + completion sync).
  fields:
    entity_id:
      name: To-do list
      description: Optional; the configured list is used if omitted.
      selector:
        entity:
          domain: todo

rebuild_calendar_tasks:
  name: Rebuild calendar tasks
  description: Re-read the configured calendars and reconcile calendar-based tasks.

export_log:
  name: Export log
  description: Export the full event log to a file under choreflow_exports/.
  fields:
    format:
      name: Format
      description: Export format.
      selector:
        select:
          options: [json, csv]

get_tasks:
  name: Get tasks
  description: Return a filtered, paginated collection of ChoreFlow tasks.
  fields:
    status:
      name: Status
      selector:
        select:
          options: [open, completed, deleted, all]
    person_entity:
      name: Person
      selector:
        entity:
          domain: person
    person_scope:
      name: Person scope
      selector:
        select:
          options: [visible, assigned]
    room:
      name: Room
      selector:
        text:
    category:
      name: Category
      selector:
        text:
    limit:
      name: Limit
      selector:
        number:
          min: 1
          max: 100
          mode: box
    offset:
      name: Offset
      selector:
        number:
          min: 0
          mode: box

get_history:
  name: Get history
  description: Return filtered, paginated ChoreFlow log events.
  fields:
    event_types:
      name: Event types
      selector:
        select:
          multiple: true
          options:
            - task_created
            - task_updated
            - task_deleted
            - task_notified
            - task_completed
            - task_snoozed
            - task_missed_no_presence
            - task_expired
            - task_synced_from_todo
            - task_completed_from_todo
            - calendar_task_created
            - calendar_task_removed
    person_entity:
      name: Person
      selector:
        entity:
          domain: person
    room:
      name: Room
      selector:
        text:
    category:
      name: Category
      selector:
        text:
    limit:
      name: Limit
      selector:
        number:
          min: 1
          max: 100
          mode: box
    offset:
      name: Offset
      selector:
        number:
          min: 0
          mode: box
